# MAC Authentication Configuration
# Bypasses PPPoE for known MAC addresses via RADIUS MAC lookup.
# Suitable for IoT devices, IPTV STBs, and printer networks.
#
# Requires: FreeRADIUS radcheck with Auth-Type=Accept entries by MAC

[mac_auth]
enabled = no

# Interface for MAC-auth clients (L2 mode with DHCP)
interface = ens33

# Use MAC address as username (format: mac / lowercase / uppercase)
username_format = mac

# RADIUS NAS identifier
nas_identifier = rnas-mac-auth

# IP pool for MAC-auth clients
ip_pool = default

# Optional: assign VLAN by RADIUS Tunnel-Private-Group-ID
vlan =
