# GRE Tunnel Configuration — Generic Routing Encapsulation
# Used for L2/L3 tunneling similar to RouterOS GRE/EoIP
#
# Requires: modprobe ip_gre (kernel module)

[gre]
enabled = no

# Local IP (NAS side)
local = 192.168.0.203

# Remote IP (peer endpoint)
remote = 192.168.0.201

# GRE tunnel inner IP subnet (NAS side)
tunnel_ip = 10.99.0.1/30

# MTU (subtract 24 bytes GRE overhead from parent iface)
mtu = 1400

# Optional: static routes through the tunnel
# routes = 192.168.200.0/24
