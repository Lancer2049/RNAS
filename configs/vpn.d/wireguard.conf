# WireGuard VPN Configuration
[wireguard]
enabled = yes
# Listen port
listen_port = 51820
# Private key path (auto-generated if empty)
private_key = /etc/wireguard/key
# Firewall marking
fwmark = 0xca6c
# MTU
mtu = 1420
# DNS servers pushed to peers
dns = 8.8.8.8, 8.8.4.4
# Allowed IPs (comma-separated)
allowed_ips = 10.99.0.0/24
# Persistent keepalive seconds
persistent_keepalive = 25
