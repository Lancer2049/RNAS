# IPIP Tunnel Configuration — IP-in-IP encapsulation
# Simple point-to-point tunnel, compatible with RouterOS IPIP
#
# Requires: modprobe ipip (kernel module)

[ipip]
enabled = no

# Local IP (NAS side)
local = 192.168.0.203

# Remote IP (peer endpoint)
remote = 192.168.0.201

# Tunnel inner IP subnet (NAS side)
tunnel_ip = 10.98.0.1/30

# MTU (subtract 20 bytes IPIP overhead)
mtu = 1480

# Optional: static routes through tunnel
# routes = 192.168.200.0/24
