# IPv6 Dual-Stack Configuration
# Enables IPv6 address assignment alongside IPv4 via DHCPv6 or SLAAC.
#
# Requires accel-ppp modules: ipv6-dhcp, ipv6-nd, ipv6-pool

[ipv6]
enabled = no

# IPv6 prefix pool (delegate from upstream /64 or ULA)
prefix = fc00::/64
delegate = fc00::/56

# DHCPv6 DNS servers
dns = 2001:4860:4860::8888,2001:4860:4860::8844
domain = rnas.local

# IPv6 Neighbor Discovery (SLAAC) parameters
ra_interval = 30

# Enable IPv6 on PPP interfaces in accel-ppp [ppp] section
# Requires: ipv6=1 in [ppp] config block
