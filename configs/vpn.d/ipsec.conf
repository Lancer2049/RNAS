# IPsec VPN Configuration (strongSwan)
[ipsec]
enabled = no
# IKE Version (1 or 2)
ike_version = 2
# Interface to listen on
interface = ens33
# Local IP for IKE negotiation
local_ip = 0.0.0.0
# Authentication method (psk|cert|eap)
auth_method = psk
# Pre-shared key (used when auth_method=psk)
pre_shared_key = change-me
# IKE cipher proposals: encryption-hash-dhgroup
ike_proposal = aes256-sha256-modp2048
# ESP cipher proposals: encryption-hash
esp_proposal = aes256-sha256
# IKE rekey time (seconds)
ike_rekey_time = 14400
# IPsec SA lifetime (seconds)
ipsec_lifetime = 3600
# Dead peer detection interval (seconds)
dpd_delay = 30
dpd_timeout = 150
# NAT traversal (yes/no)
nat_traversal = yes
# Virtual IP pool for clients
virtual_ip_pool = 10.10.10.0/24
