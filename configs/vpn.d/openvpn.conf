# OpenVPN Server Configuration
[openvpn]
enabled = yes
# Protocol (udp/tcp)
proto = udp
# Port number
port = 1194
# Device type (tun/tap)
dev = tun
# Cipher
cipher = AES-256-GCM
# Authentication digest
auth = SHA256
# TLS version minimum
tls_version_min = 1.2
# DH parameter file
dh = /etc/openvpn/dh.pem
# Certificate Authority file
ca = /etc/openvpn/ca.crt
# Server certificate
cert = /etc/openvpn/server.crt
# Server key
key = /etc/openvpn/server.key
# TLS crypt key (optional)
tls_crypt = /etc/openvpn/tls-crypt.key
# Virtual network
server_network = 10.8.0.0
server_netmask = 255.255.255.0
# Topology (subnet/net30)
topology = subnet
# Client-to-client routing
client_to_client = yes
# Keepalive interval
keepalive_interval = 10
keepalive_timeout = 120
# Max clients
max_clients = 100
# Compress (yes/no/adaptive)
compress = adaptive
# Verbosity level (0-11)
verb = 3
