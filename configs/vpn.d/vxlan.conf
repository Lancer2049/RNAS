# VXLAN Tunnel Configuration — Virtual eXtensible LAN
# Data center overlay network protocol for L2 extension over L3
# 
# Requires: modprobe vxlan

[vxlan]
enabled = no

# VXLAN Network Identifier (VNI), like VLAN ID
vni = 100

# Local IP (VTEP source)
local = 192.168.0.203

# Remote VTEP IP (peer endpoint)
remote = 192.168.0.202

# UDP destination port (IANA standard: 4789)
dstport = 4789

# MTU (subtract 50 bytes VXLAN overhead)
mtu = 1450

# Bridge to attach the VXLAN interface to
# bridge = br-vxlan

# Learning mode (default: flood-and-learn)
# learning = yes

# VXLAN Group Policy ID (optional, for ACI-style segmentation)
# gbp = off
