# VLAN Configuration — accel-ppp vlan-mon module for per-user VLAN
# Maps RADIUS Tunnel-Private-Group-Id (attr 81) to VLAN subinterfaces
#
# Usage: FreeRADIUS returns Tunnel-Type=13 (VLAN) + Tunnel-Private-Group-Id=100
#        accel-ppp auto-creates ens33.100 and binds the user session to it

[vlan]
# Enable VLAN per user
enabled = no

# Physical parent interface for VLAN subinterfaces
interface = ens33

# VLAN range to monitor (comma-separated, supports ranges like 100-200,500,900-910)
vlan_range = 2-4094

# VLAN name pattern (%P = parent interface, %I = VLAN ID)
vlan_name = %P.%I

# For IPoE: start sessions when DHCP discover arrives on VLAN subinterface
ipoE_start = dhcpv4

# For PPPoE: interface regex to match VLAN subinterfaces
pppoe_pattern = re:^ens33\.[0-9]+$

# For Q-in-Q (double tagging), use: vlan_name=%P.%I:%O (S-VLAN:C-VLAN)
