# EoIP Tunnel Configuration — Ethernet over IP (RouterOS compatible)
# Layer 2 tunnel over GRE, with unique tunnel ID for multiplexing
# Used for LAN extension and VPLS-like setups
#
# Requires: modprobe ip_gre

[eoip]
enabled = no

# Local IP (NAS side)
local = 192.168.0.203

# Remote IP (peer endpoint, e.g., RouterOS device)
remote = 192.168.0.201

# EoIP Tunnel ID (must match both sides, RouterOS default: 0)
tunnel_id = 0

# Keepalive interval (seconds, 0=disabled)
keepalive = 10

# Tunnel MAC address (optional, auto-generated if unset)
# mac = 00:00:5e:00:01:01

# Bridge to existing network (optional)
# bridge = br-lan

# MTU
mtu = 1400

# Note: EoIP uses GRE protocol with key=<tunnel_id> for multiplexing
# This enables multiple EoIP tunnels on the same IP pair (like RouterOS)
